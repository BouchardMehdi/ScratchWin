services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: scratchwin_test
      MYSQL_USER: scratchwin_test
      MYSQL_PASSWORD: integration_only_password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 20s
  tests:
    build: ./back
    command: npm run test:integration
    environment:
      NODE_ENV: test
      DB_HOST: db
      DB_USER: scratchwin_test
      DB_PASSWORD: integration_only_password
      DB_NAME: scratchwin_test
      JWT_SECRET: integration_only_secret_at_least_32_bytes
      TRUST_PROXY: 0
    depends_on:
      db:
        condition: service_healthy
