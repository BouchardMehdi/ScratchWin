services:
  front:
    build:
      context: ./front
      args:
        VITE_APP_BASE_PATH: /scratchwin/
        VITE_API_BASE_URL: /scratchwin/api
        VITE_DEV_PROXY_TARGET: http://back:3000
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "127.0.0.1:4173:80"

  back:
    build:
      context: ./back
    restart: unless-stopped
    env_file:
      - ./back/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: scratchwin
      DB_USER: scratchwin
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans back/.env et utiliser --env-file back/.env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: scratchwin
      MYSQL_USER: scratchwin
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD dans back/.env et utiliser --env-file back/.env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./back/src/db/scratchwin.sql:/docker-entrypoint-initdb.d/01-scratchwin.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
