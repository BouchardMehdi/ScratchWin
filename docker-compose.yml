services:
  front:
    build:
      context: ./front
      args:
        VITE_APP_BASE_PATH: /scratchwin/
        VITE_API_BASE_URL: /scratchwin/api
        VITE_DEV_PROXY_TARGET: http://back:3000
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "127.0.0.1:4173:80"

  back:
    build:
      context: ./back
    restart: unless-stopped
    env_file:
      - ./back/.env
    ports:
      - "127.0.0.1:3000:3000"
